# Development PostgreSQL database.
# Started and stopped automatically by spring-boot-docker-compose when the application runs,
# or by hand: docker compose up -d (works with Docker as well as OrbStack).
services:
  postgres:
    image: 'postgres:18'
    environment:
      POSTGRES_DB: 'workshop_booking'
      POSTGRES_USER: 'booking'
      POSTGRES_PASSWORD: 'booking'
    ports:
      # Random host port: Spring Boot discovers it and builds the JDBC URL itself.
      - '5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'

volumes:
  postgres-data:
