spring:
  application:
    name: workshop-booking
  flyway:
    # *:future is the default. repeatable:missing lets the app start without the dev profile
    # on a database where the demo data (repeatable migration in db/demo) has already been loaded.
    ignore-migration-patterns: '*:future,repeatable:missing'
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
